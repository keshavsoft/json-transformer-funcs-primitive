<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco Editor — JSON Transformer v3 (Powered by dom-primitive-bindings)</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="tab-bar">
        <div class="editor-tabs" id="editorTabs">
            <button class="tab-item active" id="tabColumns" type="button" title="View Columns JSON">
                <i class="bi bi-columns text-info"></i>
                <span>columns.json</span>
            </button>
            <button class="tab-item" id="tabTemplate" type="button" title="View Template JSON">
                <i class="bi bi-filetype-json text-warning"></i>
                <span>template.json</span>
            </button>
            <button class="tab-item" id="tabOutput" type="button" title="View Output JSON">
                <i class="bi bi-check2-circle text-success"></i>
                <span>output.json</span>
            </button>
            <button class="tab-item" id="specOutput" type="button" title="View Spec JSON">
                <i class="bi bi-bag-fill text-danger"></i>
                <span>spec.json</span>
            </button>
        </div>

        <div class="tab-actions">
            <button class="action-btn" id="rakaBtn" type="button" title="Load Raka Columns JSON">
                <i class="bi bi-columns"></i>
                <span>raka</span>
            </button>
            <button class="action-btn" id="templateBtn" type="button" title="Load Template JSON">
                <i class="bi bi-filetype-json"></i>
                <span>template</span>
            </button>
            <button class="action-btn" id="buildBtn" type="button" title="Build & Show Output JSON">
                <i class="bi bi-play-fill"></i>
                <span>build</span>
            </button>
            <button class="action-btn" id="specBtn" type="button" title="Build & Show Output JSON">
                <i class="bi bi-bag-fill"></i>
                <span>spec</span>
            </button>
        
            <!-- Version Switcher Menu -->
            <div class="dropdown ms-1">
                <button class="btn btn-sm dropdown-toggle text-light d-flex align-items-center gap-1" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false"
                    style="background-color: #2d2d2d; border: 1px solid #3e3e42; font-size: 12px; padding: 3px 10px; height: 26px; border-radius: 4px;">
                    <i class="bi bi-layers text-info"></i>
                    <span class="fw-semibold">v3</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow"
                    style="z-index: 9999; min-width: 230px; font-size: 13px;">
                    <li>
                        <h6 class="dropdown-header text-uppercase small text-secondary"
                            style="font-size: 10px; letter-spacing: 0.5px;">Monaco Workspaces</h6>
                    </li>
                    <li><a class="dropdown-item " href="../v1/index.html"><strong>v1</strong> <span class="text-secondary small ms-1">— Baseline 3-Tab</span></a></li>
                    <li><a class="dropdown-item " href="../v2/index.html"><strong>v2</strong> <span class="text-secondary small ms-1">— Spec-Repo &amp; Bag-Fill</span></a></li>
                    <li><a class="dropdown-item active" href="./index.html"><i class="bi bi-check2 text-success me-1"></i><strong>v3</strong> <span class="small ms-1">Flagship</span></a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="../index.html"><i class="bi bi-grid me-2 text-warning"></i>Monaco Hub Menu</a></li>
                    <li><a class="dropdown-item" href="../../index.html"><i class="bi bi-book me-2 text-info"></i>Primitive Docs Home</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div id="jsonEditor"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="https://keshavsoft.github.io/dom-primitive-bindings/dist/v5/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/json-transformer-funcs-primitive/dist/v10/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/spec-repo/dist/v6/min.js" type="module"></script>

    <script type="module" src="./js/index.js"></script>
</body>

</html>
