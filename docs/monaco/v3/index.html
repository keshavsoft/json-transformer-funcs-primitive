<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco Editor — JSON Transformer v3 (Powered by dom-primitive-bindings)</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="tab-bar">
        <div class="editor-tabs" id="editorTabs">
            <button class="tab-item active" id="tabColumns" type="button" title="View Columns JSON">
                <i class="bi bi-columns text-info"></i>
                <span>columns.json</span>
            </button>
            <button class="tab-item" id="tabTemplate" type="button" title="View Template JSON">
                <i class="bi bi-filetype-json text-warning"></i>
                <span>template.json</span>
            </button>
            <button class="tab-item" id="tabOutput" type="button" title="View Output JSON">
                <i class="bi bi-check2-circle text-success"></i>
                <span>output.json</span>
            </button>
            <button class="tab-item" id="specOutput" type="button" title="View Spec JSON">
                <i class="bi bi-bag-fill text-danger"></i>
                <span>spec.json</span>
            </button>
        </div>

        <div class="tab-actions">
            <button class="action-btn" id="rakaBtn" type="button" title="Load Raka Columns JSON">
                <i class="bi bi-columns"></i>
                <span>raka</span>
            </button>
            <button class="action-btn" id="templateBtn" type="button" title="Load Template JSON">
                <i class="bi bi-filetype-json"></i>
                <span>template</span>
            </button>
            <button class="action-btn" id="buildBtn" type="button" title="Build & Show Output JSON">
                <i class="bi bi-play-fill"></i>
                <span>build</span>
            </button>
            <button class="action-btn" id="specBtn" type="button" title="Build & Show Output JSON">
                <i class="bi bi-bag-fill"></i>
                <span>spec</span>
            </button>
        </div>
    </div>

    <div id="jsonEditor"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="https://keshavsoft.github.io/dom-primitive-bindings/dist/v5/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/json-transformer-funcs-primitive/dist/v10/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/spec-repo/dist/v6/min.js" type="module"></script>

    <script type="module" src="./js/index.js"></script>
</body>

</html>
